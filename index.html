<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>부품 재고 대장</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="부품장부">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  html, body { margin:0; padding:0; background:#1a1712; min-height:100vh; }
</style>
</head>
<body>
<div id="pl-root"></div>
<style>
  #pl-root {
    --ink: #ece7db;
    --sub: #a39a8a;
    --sub-dim: #766d5f;
    --surface: #241f18;
    --surface2: #2c261d;
    --surface3: #181410;
    --line: #3d372c;
    --line-soft: #322c22;
    --amber: #dd9f42;
    --amber-dim: #b3833a;
    --good: #7fae8c;
    --bad: #cc7361;
    font-family: 'IBM Plex Mono', 'Menlo', monospace;
    background: #17140f;
    color: var(--ink);
    padding: 22px 16px 44px;
    font-size: 13.5px;
    line-height: 1.5;
    box-sizing: border-box;
    min-height: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  #pl-root * { box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap');

  .pl-header { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid var(--line); }
  .pl-kicker { font-size:11px; letter-spacing:0.5px; color:var(--amber); margin-bottom:5px; }
  .pl-title { font-family:'Source Serif 4', serif; font-size:27px; font-weight:700; margin:0; color:var(--ink); letter-spacing:-0.2px; }
  .pl-headstat { text-align:right; }
  .pl-headstat b { display:block; font-size:21px; font-weight:600; color:var(--amber); line-height:1.2; }
  .pl-headstat span { font-size:10.5px; color:var(--sub); }

  .pl-tabs { display:flex; gap:4px; margin-bottom:18px; overflow-x:auto; padding-bottom:4px; -ms-overflow-style:none; scrollbar-width:none; }
  .pl-tabs::-webkit-scrollbar { display:none; }
  .pl-tab { position:relative; display:flex; align-items:center; gap:6px; background:transparent; border:1px solid transparent; color:var(--sub); padding:9px 13px; border-radius:7px; font-size:12.5px; font-family:inherit; cursor:pointer; white-space:nowrap; flex-shrink:0; transition:background .12s, color .12s; }
  .pl-tab:active { background:var(--surface2); }
  .pl-tab.active { background:var(--surface2); color:var(--ink); border-color:var(--line); }
  .pl-tab.active::after { content:''; position:absolute; left:12px; right:12px; bottom:-5px; height:2px; background:var(--amber); border-radius:2px; }
  .pl-count { background:var(--line); color:var(--ink); border-radius:10px; font-size:10px; padding:1.5px 6px; margin-left:1px; }
  .pl-tab.active .pl-count { background:var(--amber); color:#1a1712; }

  .pl-card { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:17px; box-shadow:0 2px 8px rgba(0,0,0,0.18); }
  .pl-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:15px; }
  .pl-field { display:flex; flex-direction:column; gap:6px; }
  .pl-field.wide { grid-column:1 / -1; }
  .pl-field label { font-size:11px; color:var(--sub); }
  .pl-input, .pl-select, textarea.pl-input {
    background:var(--surface3); border:1px solid var(--line); color:var(--ink);
    padding:10px 11px; border-radius:6px; font-size:13px; font-family:inherit; outline:none; width:100%;
    transition:border-color .12s;
  }
  .pl-input:focus, .pl-select:focus, textarea.pl-input:focus { border-color:var(--amber-dim); }
  textarea.pl-input { resize:vertical; }

  .pl-btn {
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
    background:var(--amber); color:#1a1712; border:none; padding:12px; border-radius:7px;
    font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; transition:background .12s, transform .08s;
  }
  .pl-btn:active { transform:scale(0.985); background:var(--amber-dim); }
  .pl-btn:disabled { opacity:0.5; }
  .pl-btn-sm { background:var(--amber); color:#1a1712; border:none; padding:10px 16px; border-radius:6px; font-size:12.5px; font-weight:600; font-family:inherit; cursor:pointer; transition:background .12s; }
  .pl-btn-sm:active { background:var(--amber-dim); }
  .pl-btn-outline {
    display:flex; align-items:center; justify-content:center; gap:6px; background:transparent;
    border:1px solid var(--line); color:var(--ink); padding:10px 13px; border-radius:6px;
    font-size:12.5px; font-family:inherit; cursor:pointer; transition:background .12s, border-color .12s;
  }
  .pl-btn-outline:active { background:var(--surface2); }
  .pl-btn-outline:disabled { opacity:0.4; }
  .pl-icon-btn {
    background:transparent; border:none; color:var(--sub); cursor:pointer; padding:8px;
    border-radius:6px; display:flex; align-items:center; font-size:14px; transition:background .12s, color .12s;
  }
  .pl-icon-btn:active { background:var(--surface2); color:var(--ink); }

  .pl-list { display:flex; flex-direction:column; gap:9px; }
  .pl-row {
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:9px;
    padding:12px 13px; flex-wrap:wrap; box-shadow:0 1px 4px rgba(0,0,0,0.14);
  }
  .pl-row-main { display:flex; align-items:center; gap:11px; min-width:0; }
  .pl-row-right { display:flex; align-items:center; gap:6px; }
  .pl-row-title { font-size:13.5px; color:var(--ink); font-weight:500; }
  .pl-row-sub { font-size:11px; color:var(--sub); margin-top:3px; }
  .pl-tag {
    font-size:10.5px; color:var(--amber); border:1px solid rgba(221,159,66,0.3); background:rgba(221,159,66,0.07);
    border-radius:4px; padding:3px 7px; flex-shrink:0; white-space:nowrap; font-weight:500;
  }
  .pl-price { font-size:14px; font-weight:600; color:var(--ink); }
  .pl-price-sm { font-size:12.5px; font-weight:600; color:var(--ink); }
  .pl-assign-select { background:var(--surface3); border:1px solid var(--line); color:var(--sub); font-size:11.5px; padding:7px 8px; border-radius:6px; font-family:inherit; }
  .pl-newbuild-row { display:flex; gap:8px; margin-bottom:16px; }

  .pl-build-card {
    position:relative; background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:15px 15px 15px 18px; box-shadow:0 2px 8px rgba(0,0,0,0.16); overflow:hidden;
  }
  .pl-build-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--line); }
  .pl-build-card.pl-build-assembling::before { background:var(--amber); }
  .pl-build-card.pl-build-sold::before { background:var(--good); }
  .pl-build-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:11px; }
  .pl-status-pill { font-size:10.5px; padding:3.5px 9px; border-radius:20px; flex-shrink:0; font-weight:500; }
  .pl-status-assembling { background:rgba(221,159,66,0.14); color:var(--amber); }
  .pl-status-sold { background:rgba(127,174,140,0.16); color:var(--good); }
  .pl-build-parts { display:flex; flex-direction:column; gap:7px; padding:11px 0; border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); margin-bottom:11px; }
  .pl-build-part-row { display:flex; align-items:center; gap:8px; font-size:12.5px; }
  .pl-cost-line { display:flex; justify-content:space-between; font-size:12.5px; color:var(--sub); margin-bottom:6px; }
  .pl-build-actions, .pl-sell-form { display:flex; gap:8px; margin-top:4px; flex-wrap:wrap; }
  .pl-build-actions .pl-btn-outline { flex:1; }

  .pl-ledger-summary { display:flex; justify-content:space-between; font-size:12px; color:var(--sub); margin-bottom:12px; padding:0 3px; }
  .pl-empty {
    display:flex; flex-direction:column; align-items:center; gap:12px; padding:52px 22px; text-align:center;
    color:var(--sub); font-size:13px; background:var(--surface); border:1px dashed var(--line); border-radius:10px;
  }
  .pl-empty > *:first-child { font-size:26px; opacity:0.7; }
  .pl-error-bar { display:flex; align-items:center; gap:7px; background:rgba(204,115,97,0.14); color:#e4a08f; padding:10px 13px; border-radius:7px; font-size:12px; margin-bottom:14px; }

  .pl-mode-toggle { display:flex; gap:6px; margin-bottom:13px; background:var(--surface3); padding:4px; border-radius:8px; }
  .pl-mode-btn {
    display:flex; align-items:center; justify-content:center; gap:6px; flex:1; background:transparent;
    border:none; color:var(--sub); padding:9px; border-radius:6px; font-size:12.5px; font-family:inherit; cursor:pointer; transition:background .12s, color .12s;
  }
  .pl-mode-btn.active { background:var(--surface2); color:var(--amber); }

  .pl-dropzone {
    display:flex; flex-direction:column; align-items:center; gap:9px; width:100%; background:var(--surface3);
    border:1.5px dashed var(--line); border-radius:9px; padding:34px 14px; color:var(--sub); font-size:12px;
    font-family:inherit; cursor:pointer; transition:border-color .15s, background .15s; text-align:center; line-height:1.6;
  }
  .pl-dropzone > *:first-child { font-size:24px; }
  .pl-dropzone.pl-drag-over { border-color:var(--amber); background:rgba(221,159,66,0.06); color:var(--amber); }
  .pl-preview-wrap.pl-drag-over { outline:2px solid var(--amber); outline-offset:2px; }
  .pl-preview-wrap { position:relative; cursor:pointer; border-radius:9px; overflow:hidden; border:1px solid var(--line); }
  .pl-preview-wrap img { width:100%; max-height:220px; object-fit:cover; display:block; }
  .pl-preview-hint { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.65); color:var(--ink); font-size:11px; padding:8px; text-align:center; }
  .pl-extracted-notice { display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--amber); margin-bottom:13px; padding:9px 11px; background:rgba(221,159,66,0.08); border-radius:7px; }
  .pl-spin { display:inline-block; animation:pl-spin 0.8s linear infinite; }
  @keyframes pl-spin { from { transform:rotate(0deg);} to { transform:rotate(360deg);} }
  .pl-success { text-align:center; color:var(--good); display:flex; flex-direction:column; align-items:center; gap:9px; padding:36px; }
  .pl-success > *:first-child { font-size:26px; }

  .pl-item-list { display:flex; flex-direction:column; gap:9px; margin-bottom:12px; }
  .pl-item-card { background:var(--surface3); border:1px solid var(--line); border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .pl-item-top { display:flex; gap:7px; align-items:center; }
  .pl-item-cat { flex:0 0 104px; }
  .pl-item-price { flex:1 1 auto; min-width:0; }
  .pl-item-top .pl-icon-btn { flex-shrink:0; margin-left:auto; }
  .pl-item-card .pl-input, .pl-item-card .pl-select { font-size:12.5px; padding:8px 9px; }
</style>
<script>
(function () {
  const CATEGORIES = ["CPU", "GPU", "메인보드", "RAM", "저장장치", "파워", "케이스", "쿨러", "기타"];
  const SITES = ["당근마켓", "번개장터", "중고나라", "다나와장터"];
  const guessSite = (raw) => {
    const s = String(raw || "");
    if (s.includes("당근")) return "당근마켓";
    if (s.includes("번개")) return "번개장터";
    if (s.includes("중고나라") || s.includes("네이버페이") || s.includes("중나페이")) return "중고나라";
    if (s.includes("다나와")) return "다나와장터";
    return SITES.includes(s) ? s : "";
  };
  const root = document.getElementById("pl-root");
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const won = (n) => (Number(n) || 0).toLocaleString("ko-KR") + "원";
  const today = () => new Date().toISOString().slice(0, 10);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // 실제 결제 영수증 3건 역산 기준(2026.09) 확정값. 나머지는 검색 기준 추정치 — 실측 후 조정 권장.
  const DEFAULT_FEE_CONFIG = {
    rates: { "당근마켓": 2.2, "번개장터": 0, "중고나라": 3.5, "다나와장터": 0 },
    shipping: 3600,
  };

  let state = {
    purchases: [],
    builds: [],
    tab: "quick",
    loaded: false,
    error: "",
    feeConfig: DEFAULT_FEE_CONFIG,
    settingsOpen: false,
    apiSettingsOpen: false,
    editingId: null,
    quick: { mode: "image", rawText: "", imagePreview: null, imageData: null, status: "idle", errorMsg: "", extracted: null, justAdded: false },
    manual: { date: today(), site: "", items: [{ category: CATEGORIES[0], part: "", price: "" }], fee: "", freeShipping: false, justAdded: false },
  };

  function setState(patch) {
    state = { ...state, ...patch };
    render();
  }

  function loadData() {
    let p = [], b = [], fc = DEFAULT_FEE_CONFIG;
    try {
      const rp = localStorage.getItem("parts-ledger:purchases");
      if (rp) p = JSON.parse(rp);
      const rb = localStorage.getItem("parts-ledger:builds");
      if (rb) b = JSON.parse(rb);
      const rfc = localStorage.getItem("parts-ledger:fee-config");
      if (rfc) fc = { ...DEFAULT_FEE_CONFIG, ...JSON.parse(rfc) };
    } catch (e) {
      setState({ error: "데이터를 불러오지 못했습니다." });
    }
    setState({ purchases: p, builds: b, feeConfig: fc, loaded: true });
  }

  function persist(nextPurchases, nextBuilds) {
    try {
      if (nextPurchases) localStorage.setItem("parts-ledger:purchases", JSON.stringify(nextPurchases));
      if (nextBuilds) localStorage.setItem("parts-ledger:builds", JSON.stringify(nextBuilds));
    } catch (e) {
      setState({ error: "저장에 실패했습니다. 다시 시도해주세요." });
    }
  }

  function persistFeeConfig(fc) {
    try {
      localStorage.setItem("parts-ledger:fee-config", JSON.stringify(fc));
    } catch (e) {
      setState({ error: "설정 저장에 실패했습니다." });
    }
  }

  function addPurchase(entry) {
    const next = [{ id: uid(), status: "stock", buildId: null, ...entry }, ...state.purchases];
    setState({ purchases: next });
    persist(next, null);
  }

  function deletePurchase(id) {
    const next = state.purchases.filter((p) => p.id !== id);
    setState({ purchases: next });
    persist(next, null);
  }

  function updatePurchase(id, patch) {
    const next = state.purchases.map((p) => (p.id === id ? { ...p, ...patch } : p));
    setState({ purchases: next });
    persist(next, null);
  }

  function addBuild(name) {
    const b = { id: uid(), name, createdDate: today(), status: "assembling", soldDate: null, salePrice: null, buyer: "" };
    const next = [b, ...state.builds];
    setState({ builds: next });
    persist(null, next);
  }

  function assignPart(partId, buildId) {
    const next = state.purchases.map((p) => (p.id === partId ? { ...p, status: buildId ? "assigned" : "stock", buildId: buildId || null } : p));
    setState({ purchases: next });
    persist(next, null);
  }

  function sellBuild(buildId, salePrice, buyer) {
    const nb = state.builds.map((b) => (b.id === buildId ? { ...b, status: "sold", soldDate: today(), salePrice, buyer } : b));
    const np = state.purchases.map((p) => (p.buildId === buildId ? { ...p, status: "sold" } : p));
    setState({ builds: nb, purchases: np });
    persist(np, nb);
  }

  function deleteBuild(buildId) {
    const np = state.purchases.map((p) => (p.buildId === buildId ? { ...p, status: "stock", buildId: null } : p));
    const nb = state.builds.filter((b) => b.id !== buildId);
    setState({ purchases: np, builds: nb });
    persist(np, nb);
  }

  const EXTRACT_PROMPT = `다음은 중고 PC 부품 거래 매물의 캡처 이미지 또는 텍스트입니다.
이 매물에서 정보를 추출해서 아래 JSON 형식으로만 답하세요. 설명, 코드블록, 다른 텍스트 없이 JSON 객체 하나만 출력하세요.

한 매물에 부품이 여러 개 함께 판매되는 경우(예: "CPU+메인보드 세트", "그래픽카드+파워 동시 판매")는 items 배열에 각 부품을 별도 항목으로 나눠서 담으세요. 세트 전체 가격만 있고 개별 가격이 없으면, 부품별로 합리적으로 가격을 나눠서 채우세요(예: 시세 비율 고려). 부품이 하나뿐이면 items 배열에 항목 하나만 넣으세요.

어느 플랫폼(당근마켓/번개장터/중고나라/다나와장터) 캡처인지는 화면에 플랫폼 이름이 텍스트로 없어도, 아래 같은 시각적 단서로 판단하세요:
- 당근마켓: 주황색(오렌지) 계열 강조색, 당근 모양 아이콘/로고, "당근페이", "안심결제", "네이버페이"라는 단어 없이 자체 결제, 동네/거리 정보 표시
- 번개장터: 민트/초록 계열 강조색, 번개 모양 로고, "번개페이", "번개톡", 브랜드/카테고리 필터 UI
- 중고나라: 초록색 계열(네이버 브랜드 톤), "중고나라페이", "안심결제 수단: 네이버페이", 카페 특유의 게시글형 UI
- 다나와장터: 다나와 특유의 파란색/스펙 비교 중심 UI, "다나와" 로고
결제 상세내역 화면이면 "안심결제 수단"에 표시된 결제사(예: 네이버페이)나 거래번호 접두어(예: KPE로 시작하면 당근페이 계열) 같은 세부 단서도 활용하세요. 그래도 확신이 안 서면 site는 빈 문자열로 두세요.

{"items": [{"part": "부품명(모델명 포함, 없으면 빈 문자열)", "category": "CPU, GPU, 메인보드, RAM, 저장장치, 파워, 케이스, 쿨러, 기타 중 가장 가까운 하나", "price": 숫자만(원 단위, 콤마·원·₩ 등 기호 제외, 모르면 0)}], "site": "당근마켓, 번개장터, 중고나라, 다나와장터 중 하나로 추정, 확실하지 않으면 빈 문자열", "free_shipping": 이미지나 텍스트에 "무료배송" 문구가 명시되어 있으면 true, 없거나 확실하지 않으면 false}`;

  function getApiKey() {
    try { return (localStorage.getItem("parts-ledger:api-key") || "").trim(); } catch (e) { return ""; }
  }

  function maskKey(key) {
    if (!key) return "";
    if (key.length <= 10) return "••••••••";
    return key.slice(0, 7) + "…" + key.slice(-4);
  }

  window.plToggleApiSettings = function () {
    setState({ apiSettingsOpen: !state.apiSettingsOpen });
  };

  window.plSaveApiKey = function () {
    const input = document.getElementById("pl-apikey-input");
    const val = (input?.value || "").trim();
    if (!val) return;
    try { localStorage.setItem("parts-ledger:api-key", val); } catch (e) {}
    setState({ apiSettingsOpen: false, error: "" });

  async function callClaudeExtract(content) {
    const key = getApiKey();
    const headers = { "Content-Type": "application/json" };
    if (key) {
      headers["x-api-key"] = key;
      headers["anthropic-version"] = "2023-06-01";
      headers["anthropic-dangerous-direct-browser-access"] = "true";
    }
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers,
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 400, messages: [{ role: "user", content }] }),
    });
    if (!response.ok) {
      let detail = "";
      try {
        const errBody = await response.json();
        detail = errBody?.error?.message || "";
      } catch (e) {}
      if (!key) throw new Error("API 키가 설정되지 않았어요. 화면 상단 '⚙ API 키' 버튼을 눌러 키를 입력해주세요.");
      throw new Error(detail ? `API 요청 실패: ${detail}` : `API 요청 실패 (${response.status})`);
    }
    const data = await response.json();
    const raw = (data.content || []).map((b) => b.text || "").join("");
    const clean = raw.replace(/```json|```/g, "").trim();
    const match = clean.match(/\{[\s\S]*\}/);
    if (!match) throw new Error("응답을 해석할 수 없습니다");
    return JSON.parse(match[0]);
  }

  // Always normalize to PNG via canvas so HEIC / odd formats never reach the API unsupported.
  function normalizeImageToPng(file, maxDim = 1600) {
    return new Promise((resolve, reject) => {
      const objUrl = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (!width || !height) {
          URL.revokeObjectURL(objUrl);
          reject(new Error("이미지를 읽을 수 없는 형식이에요. 스크린샷(PNG/JPG)으로 다시 시도해주세요."));
          return;
        }
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/png");
        URL.revokeObjectURL(objUrl);
        resolve({ base64: dataUrl.split(",")[1], mediaType: "image/png", previewUrl: dataUrl });
      };
      img.onerror = () => {
        URL.revokeObjectURL(objUrl);
        reject(new Error("이미지를 불러오지 못했어요. HEIC 형식이면 스크린샷으로 대신 시도해주세요."));
      };
      img.src = objUrl;
    });
  }

  window.plRunExtract = async function () {
    const q = { ...state.quick };
    if (q.mode === "text") {
      q.rawText = document.getElementById("pl-rawtext")?.value || "";
    }
    setState({ quick: { ...q, status: "extracting", errorMsg: "" } });
    try {
      let result;
      if (q.mode === "image") {
        if (!q.imageData) throw new Error("이미지를 먼저 선택해주세요.");
        result = await callClaudeExtract([
          { type: "image", source: { type: "base64", media_type: q.imageData.mediaType, data: q.imageData.base64 } },
          { type: "text", text: EXTRACT_PROMPT },
        ]);
      } else {
        const input = q.rawText.trim();
        if (!input) throw new Error("링크 또는 텍스트를 입력해주세요.");
        if (/^https?:\/\//i.test(input) && !/\s/.test(input)) {
          try {
            const pageRes = await fetch(input);
            const pageText = await pageRes.text();
            result = await callClaudeExtract([{ type: "text", text: `${EXTRACT_PROMPT}\n\n페이지 내용:\n${pageText.slice(0, 6000)}` }]);
          } catch (fetchErr) {
            throw new Error("이 링크는 앱에서 직접 열 수 없습니다. 매물 페이지에서 제목과 가격을 복사해서 붙여넣어주세요.");
          }
        } else {
          result = await callClaudeExtract([{ type: "text", text: `${EXTRACT_PROMPT}\n\n내용:\n${input}` }]);
        }
        q.rawText = input;
      }
      let site = guessSite(result.site);
      const freeShipping = !!result.free_shipping;
      const rawItems = Array.isArray(result.items) && result.items.length ? result.items : [result];
      const items = rawItems.map((it) => ({
        category: CATEGORIES.includes(it.category) ? it.category : "기타",
        part: it.part || "",
        price: it.price ? String(it.price) : "",
      }));
      const totalPrice = items.reduce((s, it) => s + (Number(it.price) || 0), 0);
      const fee = site ? String(calcSuggestedFee(site, totalPrice, freeShipping)) : "";
      setState({
        quick: {
          ...q,
          status: "done",
          extracted: { date: today(), site, items, fee, freeShipping },
        },
      });
    } catch (e) {
      setState({ quick: { ...state.quick, status: "error", errorMsg: e.message || "추출에 실패했습니다." } });
    }
  };

  function distributeAndAdd(meta, items) {
    const valid = items.filter((it) => it.part.trim() && it.price);
    if (valid.length === 0) return 0;
    const fee = Number(meta.fee) || 0;
    const totalBase = valid.reduce((s, it) => s + Number(it.price), 0);
    let allocated = 0;
    valid.forEach((it, idx) => {
      let price = Number(it.price);
      if (fee > 0) {
        if (totalBase > 0) {
          const isLast = idx === valid.length - 1;
          const share = isLast ? fee - allocated : Math.round(fee * (Number(it.price) / totalBase));
          allocated += share;
          price += share;
        } else if (idx === 0) {
          price += fee;
        }
      }
      addPurchase({ date: meta.date, site: meta.site, category: it.category, part: it.part.trim(), price });
    });
    return valid.length;
  }

    const site = document.getElementById("pl-edit-site-" + id)?.value || "";
    const category = document.getElementById("pl-edit-cat-" + id)?.value || CATEGORIES[0];
    const price = Number(document.getElementById("pl-edit-price-" + id)?.value) || 0;
    const part = (document.getElementById("pl-edit-part-" + id)?.value || "").trim();
    if (!part || !price) return;
    updatePurchase(id, { date, site, category, part, price });
    setState({ editingId: null });
  };

  function renderPurchaseEditRow(p) {
    return `
      <div class="pl-row" style="flex-direction:column; align-items:stretch;">
        <div class="pl-grid" style="margin-bottom:8px;">
          <div class="pl-field"><label>구매일</label><input id="pl-edit-date-${p.id}" class="pl-input" type="date" value="${esc(p.date)}"></div>
          <div class="pl-field"><label>구매 사이트</label>
            <select id="pl-edit-site-${p.id}" class="pl-select">
              <option value="" ${!p.site ? "selected" : ""}>미지정</option>
              ${SITES.map((s) => `<option value="${s}" ${s === p.site ? "selected" : ""}>${s}</option>`).join("")}
            </select>
          </div>
          <div class="pl-field"><label>분류</label>
            <select id="pl-edit-cat-${p.id}" class="pl-select">
              ${CATEGORIES.map((c) => `<option value="${c}" ${c === p.category ? "selected" : ""}>${c}</option>`).join("")}
            </select>
          </div>
          <div class="pl-field"><label>가격</label><input id="pl-edit-price-${p.id}" class="pl-input" type="number" min="0" value="${p.price}"></div>
          <div class="pl-field wide"><label>부품명 / 모델명</label><input id="pl-edit-part-${p.id}" class="pl-input" type="text" value="${esc(p.part)}"></div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="pl-btn-sm" onclick="plSaveEdit('${p.id}')">저장</button>
          <button class="pl-btn-outline" onclick="plCancelEdit()">취소</button>
        </div>
      </div>`;
  }

  function renderPurchaseRow(p, opts) {
    opts = opts || {};
    if (state.editingId === p.id) return renderPurchaseEditRow(p);
    const openBuilds = opts.openBuilds || [];
    return `
      <div class="pl-row">
        <div class="pl-row-main">
          <span class="pl-tag">${esc(p.category)}</span>
          <div>
            <div class="pl-row-title">${esc(p.part)}</div>
            <div class="pl-row-sub">${esc(p.date)} · ${esc(p.site || "출처 미기재")}${opts.statusText ? " · " + esc(opts.statusText) : ""}</div>
          </div>
        </div>
        <div class="pl-row-right">
          <span class="pl-price">${won(p.price)}</span>
          ${
            opts.showAssign
              ? `<select class="pl-assign-select" onchange="plAssign('${p.id}', this)">
                <option value="" disabled selected>본체에 배정</option>
                ${openBuilds.map((b) => `<option value="${b.id}">${esc(b.name)}</option>`).join("")}
              </select>`
              : ""
          }
          <button class="pl-icon-btn" onclick="plStartEdit('${p.id}')">✎</button>
          <button class="pl-icon-btn" onclick="plDeletePurchase('${p.id}')">${iconX()}</button>
        </div>
      </div>`;
  }

  function renderStock() {
    const parts = state.purchases.filter((p) => p.status === "stock");
    const openBuilds = state.builds.filter((b) => b.status === "assembling");
    if (parts.length === 0) return `<div class="pl-empty">📦<div>재고에 있는 부품이 없습니다. '빠른 등록' 또는 '직접 입력'에서 매입한 부품을 추가하세요.</div></div>`;
    return `
      <div class="pl-newbuild-row">
        <input id="pl-newbuild-input" class="pl-input" type="text" placeholder="새 본체 이름 (예: 본체 2026-09-05 #1)">
        <button class="pl-btn-outline" style="flex-shrink:0;" onclick="plCreateBuild()">+ 본체 만들기</button>
      </div>
      <div class="pl-list">
        ${parts.map((p) => renderPurchaseRow(p, { showAssign: true, openBuilds })).join("")}
      </div>`;
  }

  function renderBuilds() {
    if (state.builds.length === 0) return `<div class="pl-empty">🖥️<div>아직 만든 본체가 없습니다. '재고' 탭에서 부품을 모아 본체를 만들어보세요.</div></div>`;
    return `<div class="pl-list">${state.builds.map(renderBuildCard).join("")}</div>`;
  }

  function renderBuildCard(b) {
    const parts = state.purchases.filter((p) => p.buildId === b.id);
    const cost = parts.reduce((s, p) => s + Number(p.price || 0), 0);
    const profit = b.salePrice != null ? b.salePrice - cost : null;
    const selling = state._selling === b.id;
    return `
      <div class="pl-build-card ${b.status === "sold" ? "pl-build-sold" : "pl-build-assembling"}">
        <div class="pl-build-header">
          <div>
            <div class="pl-row-title">${esc(b.name)}</div>
            <div class="pl-row-sub">${esc(b.createdDate)} 조립 시작 · 부품 ${parts.length}개</div>
          </div>
          <span class="pl-status-pill ${b.status === "sold" ? "pl-status-sold" : "pl-status-assembling"}">${b.status === "sold" ? "판매완료" : "조립중"}</span>
        </div>
        <div class="pl-build-parts">
          ${parts
            .map(
              (p) => `
            <div class="pl-build-part-row">
              <span class="pl-tag">${esc(p.category)}</span>
              <span style="flex:1;">${esc(p.part)}</span>
              <span class="pl-price-sm">${won(p.price)}</span>
              ${b.status !== "sold" ? `<button class="pl-icon-btn" onclick="plUnassign('${p.id}')">${iconX()}</button>` : ""}
            </div>`
            )
            .join("")}
        </div>
        <div class="pl-cost-line"><span>총 원가</span><span class="pl-price-sm">${won(cost)}</span></div>
        ${
          b.status === "sold"
            ? `<div class="pl-cost-line"><span>판매가${b.buyer ? " · " + esc(b.buyer) : ""}</span><span class="pl-price-sm">${won(b.salePrice)}</span></div>
               <div class="pl-cost-line" style="font-weight:600;"><span>수익</span><span style="color:${profit >= 0 ? "var(--good)" : "var(--bad)"}">${profit >= 0 ? "+" : ""}${won(profit)}</span></div>`
            : selling
            ? `<div class="pl-sell-form">
                <input id="pl-sell-price-${b.id}" class="pl-input" type="number" placeholder="판매가" style="flex:1;">
                <input id="pl-sell-buyer-${b.id}" class="pl-input" type="text" placeholder="구매자 (선택)" style="flex:1;">
                <button class="pl-btn-sm" onclick="plConfirmSell('${b.id}')">확정</button>
              </div>`
            : `<div class="pl-build-actions">
                <button class="pl-btn-outline" ${parts.length === 0 ? "disabled" : ""} onclick="plStartSell('${b.id}')">📈 판매 처리</button>
                <button class="pl-icon-btn" onclick="plDeleteBuild('${b.id}')">${iconX()}</button>
              </div>`
        }
      </div>`;
  }

  function renderLedger() {
    if (state.purchases.length === 0) return `<div class="pl-empty">📋<div>기록된 구매 내역이 없습니다.</div></div>`;
    const buildName = (id) => (state.builds.find((b) => b.id === id) || {}).name || "—";
    const total = state.purchases.reduce((s, p) => s + Number(p.price || 0), 0);
    return `
      <div class="pl-ledger-summary"><span>총 ${state.purchases.length}건</span><span class="pl-price-sm">누적 매입 ${won(total)}</span></div>
      <div class="pl-list">
        ${state.purchases
          .map((p) =>
            renderPurchaseRow(p, {
              statusText: p.status === "stock" ? "재고" : p.status === "assigned" ? buildName(p.buildId) + "에 배정" : "판매완료",
            })
          )
          .join("")}
      </div>`;
  }

  function render() {
    if (!state.loaded) {
      root.innerHTML = `<div style="padding:40px; text-align:center; color:var(--sub); font-size:13px;">불러오는 중...</div>`;
      return;
    }
    const stockCount = state.purchases.filter((p) => p.status === "stock").length;
    const stockValue = state.purchases.filter((p) => p.status === "stock").reduce((s, p) => s + Number(p.price || 0), 0);
    let body;
    if (state.tab === "quick") body = renderQuick();
    else if (state.tab === "add") body = renderManual();
    else if (state.tab === "stock") body = renderStock();
    else if (state.tab === "builds") body = renderBuilds();
    else body = renderLedger();

    const fc = state.feeConfig || DEFAULT_FEE_CONFIG;
    root.innerHTML = `
      <div class="pl-header">
        <div>
          <div class="pl-kicker">부품 매입 · 조립 장부</div>
          <h1 class="pl-title">재고 대장</h1>
        </div>
        <div class="pl-headstat"><b>${stockCount}</b><span>재고 부품 · ${won(stockValue)}</span></div>
      </div>
      <div style="display:flex; justify-content:flex-end; margin-bottom:${state.settingsOpen || state.apiSettingsOpen ? "8" : "14"}px;">
        <button class="pl-icon-btn" style="font-size:11px; gap:4px; border:1px solid var(--line); border-radius:4px; padding:5px 9px;" onclick="plToggleFeeSettings()">⚙ 수수료·배송비 설정</button>
        <button class="pl-icon-btn" style="font-size:11px; gap:4px; border:1px solid var(--line); border-radius:4px; padding:5px 9px;" onclick="plToggleApiSettings()">⚙ API 키 ${getApiKey() ? `설정됨 (${maskKey(getApiKey())})` : "설정 안 됨"}</button>
      </div>
      ${
        state.apiSettingsOpen
          ? `<div class="pl-card" style="margin-bottom:14px;">
              <div class="pl-field" style="margin-bottom:10px;">
                <label>Anthropic API 키 (console.anthropic.com &gt; API Keys 에서 발급)</label>
                <input id="pl-apikey-input" class="pl-input" type="password" autocomplete="off" placeholder="${getApiKey() ? maskKey(getApiKey()) : "sk-ant-..."}">
              </div>
              <div style="font-size:11px; color:var(--sub); margin-bottom:10px; line-height:1.5;">
                이 앱은 서버 없이 브라우저에서 직접 API를 호출해요. 키가 이 기기의 브라우저에만 저장되지만, 완전히 안전하진 않아요.
                Anthropic 콘솔에서 이 키에 사용 한도(spend limit)를 걸어두는 걸 권장해요.
              </div>
              <div style="display:flex; gap:8px;">
                <button class="pl-btn-sm" onclick="plSaveApiKey()">저장</button>
                ${getApiKey() ? `<button class="pl-btn-outline" onclick="plClearApiKey()">${iconX()} 키 삭제</button>` : ""}
                <button class="pl-btn-outline" onclick="plToggleApiSettings()">닫기</button>
              </div>
            </div>`
          : ""
      }
      ${
        state.settingsOpen
          ? `<div class="pl-card" style="margin-bottom:14px;">
              <div style="font-size:11px; color:var(--sub); margin-bottom:10px; line-height:1.5;">
                사이트별 구매자 부담 안전결제 수수료율(%)과 기본 택배비예요. 정책이 자주 바뀌니 실제 결제 화면 기준으로 조정해두세요.
              </div>
              <div class="pl-item-list" style="margin-bottom:10px;">
                ${SITES.map(
                  (s) => `
                  <div style="display:grid; grid-template-columns:1fr 90px; gap:8px; align-items:center;">
                    <span style="font-size:12.5px;">${s}</span>
                    <div style="position:relative;">
                      <input id="pl-rate-${s}" class="pl-input" type="number" min="0" step="0.1" value="${fc.rates?.[s] ?? 0}" style="padding-right:24px;">
                      <span style="position:absolute; right:8px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--sub);">%</span>
                    </div>
                  </div>`
                ).join("")}
              </div>
              <div class="pl-field" style="margin-bottom:12px;">
                <label>기본 택배비 (원)</label>
                <input id="pl-shipping-input" class="pl-input" type="number" min="0" value="${fc.shipping ?? 0}">
              </div>
              <div style="display:flex; gap:8px;">
                <button class="pl-btn-sm" onclick="plSaveFeeConfig()">저장</button>
                <button class="pl-btn-outline" onclick="plToggleFeeSettings()">닫기</button>
              </div>
            </div>`
          : ""
      }
      ${state.error ? `<div class="pl-error-bar">${iconWarn()} ${esc(state.error)}</div>` : ""}
      <div class="pl-tabs">
        <button class="pl-tab ${state.tab === "quick" ? "active" : ""}" onclick="plSetTab('quick')">${iconSparkle()} 빠른 등록</button>
        <button class="pl-tab ${state.tab === "add" ? "active" : ""}" onclick="plSetTab('add')">✎ 직접 입력</button>
        <button class="pl-tab ${state.tab === "stock" ? "active" : ""}" onclick="plSetTab('stock')">🗄 재고<span class="pl-count">${stockCount}</span></button>
        <button class="pl-tab ${state.tab === "builds" ? "active" : ""}" onclick="plSetTab('builds')">🖥 조립/판매<span class="pl-count">${state.builds.length}</span></button>
        <button class="pl-tab ${state.tab === "ledger" ? "active" : ""}" onclick="plSetTab('ledger')">📋 전체 장부<span class="pl-count">${state.purchases.length}</span></button>
      </div>
      <div>${body}</div>
    `;
  }

  document.addEventListener("paste", (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    let imageFile = null;
    for (const item of items) {
      if (item.type && item.type.startsWith("image/")) {
        imageFile = item.getAsFile();
        break;
      }
    }
    if (!imageFile) return; // no image on clipboard, let normal text paste behave as usual
    e.preventDefault();
    setState({ tab: "quick", quick: { ...state.quick, mode: "image", errorMsg: "" } });
    processImageFile(imageFile);
  });

  render();
  loadData();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
